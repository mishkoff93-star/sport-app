<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Здоровых Привычек</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            width: 300px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
            font-variant-numeric: tabular-nums; /* Чтобы цифры не прыгали */
        }

        .timer-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        label {
            font-size: 0.85rem;
            text-align: left;
            color: #666;
        }

        input[type="datetime-local"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Карточка Кальяна -->
    <div class="card">
        <h2>Без Кальяна</h2>
        <div class="timer-label">Время чистоты</div>
        <div class="timer-display" id="timer-hookah">00:00:00</div>
        
        <div class="controls">
            <label for="date-hookah">Дата последней затяжки:</label>
            <input type="datetime-local" id="date-hookah">
            <button onclick="saveDate('hookah')">Обновить дату</button>
        </div>
    </div>

    <!-- Карточка Алкоголя -->
    <div class="card">
        <h2>Без Алкоголя</h2>
        <div class="timer-label">Время трезвости</div>
        <div class="timer-display" id="timer-alcohol">00:00:00</div>

        <div class="controls">
            <label for="date-alcohol">Дата последнего бокала:</label>
            <input type="datetime-local" id="date-alcohol">
            <button onclick="saveDate('alcohol')">Обновить дату</button>
        </div>
    </div>
</div>

<script>
    // Базовая дата по умолчанию: 28.02.2026 00:00
    const DEFAULT_DATE = "2026-02-28T00:00";

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        initTracker('hookah');
        initTracker('alcohol');
        
        // Запускаем обновление таймеров каждую секунду
        setInterval(updateTimers, 1000);
        updateTimers(); // Первый вызов сразу
    });

    function initTracker(type) {
        const savedDate = localStorage.getItem(`date-${type}`);
        const inputElement = document.getElementById(`date-${type}`);
        
        // Если дата сохранена, ставим её в инпут, иначе ставим базовую
        if (savedDate) {
            inputElement.value = savedDate;
        } else {
            inputElement.value = DEFAULT_DATE;
        }
    }

    function saveDate(type) {
        const inputElement = document.getElementById(`date-${type}`);
        const newDate = inputElement.value;
        
        if (newDate) {
            localStorage.setItem(`date-${type}`, newDate);
            updateTimers(); // Сразу обновляем таймер
            alert('Дата успешно сохранена!');
        }
    }

    function updateTimers() {
        updateSingleTimer('hookah');
        updateSingleTimer('alcohol');
    }

    function updateSingleTimer(type) {
        const savedDateString = localStorage.getItem(`date-${type}`);
        // Если нет сохраненной даты, берем дефолтную
        const targetDate = savedDateString ? new Date(savedDateString) : new Date(DEFAULT_DATE);
        const now = new Date();

        const displayElement = document.getElementById(`timer-${type}`);

        // Разница во времени (в миллисекундах)
        let diff = now - targetDate;

        // Если дата в будущем (пока не наступила), показываем 0
        if (diff < 0) {
            displayElement.innerText = "00:00:00";
            return;
        }

        // Вычисления
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        // Можно добавить секунды, если нужно:
        // const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        // Форматирование (добавляем ноль спереди, если число меньше 10)
        const fDays = days < 10 ? '0' + days : days;
        const fHours = hours < 10 ? '0' + hours : hours;
        const fMinutes = minutes < 10 ? '0' + minutes : minutes;

        // Вывод: Дни : Часы : Минуты
        displayElement.innerText = `${fDays}д ${fHours}ч ${fMinutes}м`;
    }
</script>

</body>
</html>
